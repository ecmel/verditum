name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "vite.web.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          response="$RUNNER_TEMP/pages-configuration.json"
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")

          case "$status" in
            200)
              build_type=$(jq -er '.build_type' "$response")
              if [[ "$build_type" == "workflow" ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Pages deployment skipped: select GitHub Actions as the Pages source in Settings → Pages." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Pages deployment skipped: no accessible Pages site. Enable Pages with GitHub Actions in Settings → Pages, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Pages configuration check failed (HTTP $status)."
              exit 1
              ;;
          esac
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs
      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
